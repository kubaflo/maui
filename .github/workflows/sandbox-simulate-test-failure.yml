# Sandbox only: Azure DevOps cannot run tests for this fork, so post a run-tests result the way
# review-run-tests-results would, then continue PR Autopilot.
name: Sandbox simulate run-tests failure
on:
  workflow_dispatch:
    inputs:
      pr_number: { required: true, type: string }
      test_name: { required: true, type: string }
      test_code: { required: true, type: string }
      error: { required: true, type: string }
permissions: {}
jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions: { actions: write, contents: write, issues: write, pull-requests: write }
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: "${{ inputs.pr_number }}"
          TEST_NAME: "${{ inputs.test_name }}"
          TEST_CODE: "${{ inputs.test_code }}"
          TEST_ERROR: "${{ inputs.error }}"
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            let { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            // Like a contributor, add a test that documents the intended behavior and fails today.
            const path = 'src/TextKit.Tests/TextUtilsTests.cs';
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path, ref: pr.head.ref });
            let text = Buffer.from(file.content, 'base64').toString('utf8').trimEnd();
            text = text.replace(/}\s*$/, '') + '\n\t[Fact]\n\tpublic void ' + process.env.TEST_NAME + '()\n\t\t=> ' + process.env.TEST_CODE + ';\n}\n';
            await github.rest.repos.createOrUpdateFileContents({ ...context.repo, path, branch: pr.head.ref, sha: file.sha,
              message: `Add ${process.env.TEST_NAME} test`, content: Buffer.from(text).toString('base64') });
            ({ data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number }));
            // Sandbox stand-in for a clean expert review of the new head, so the loop is in its test stage.
            await github.rest.pulls.createReview({ ...context.repo, pull_number: number, commit_id: pr.head.sha, event: 'COMMENT',
              body: '## Expert Review — 0 findings\n\n_Sandbox stand-in: the expert review of this head is treated as clean._' });
            const body = [
              '<!-- review-run-tests-all -->',
              '### 🧪 /review run-tests',
              '<img alt="Result FAILED" src="https://img.shields.io/badge/Result-FAILED-cf222e">',
              '',
              '<!-- run-tests-section: ui -->',
              `❌ Sandbox stand-in for maui-pr-uitests: 1 test failed. Reproduce with \`dotnet test src/TextKit.Tests/TextKit.Tests.csproj --filter ${process.env.TEST_NAME}\`.`,
              '',
              '| Test | Error |', '|---|---|',
              `| \`TextUtilsTests.${process.env.TEST_NAME}\` | \`${process.env.TEST_ERROR}\` |`,
              `<!-- review-run-tests-head: ${pr.head.sha} -->`,
              '<!-- review-run-tests-state: done -->',
              '<!-- run-tests-result: FAILED -->',
              '<!-- /run-tests-section: ui -->',
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: ['s/autopilot-running'] });
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'pr-autopilot.lock.yml',
              ref: context.payload.repository.default_branch, inputs: { pr_number: String(number) } });
