name: Credential-free canary attempt

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      snapshot:
        type: string
        required: true
      sample:
        type: string
        required: true
      candidate:
        type: string
        required: true
      attempt:
        type: number
        required: true
      previous:
        type: string
        default: ''
    outputs:
      result:
        value: ${{ jobs.verify.outputs.result }}
      verdict:
        value: ${{ jobs.verify.outputs.verdict }}

permissions: {}

jobs:
  verify:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-22.04' }}
    timeout-minutes: 120
    outputs:
      result: ${{ steps.transfer.outputs.payload }}
      verdict: ${{ steps.transfer.outputs.verdict }}
    env:
      APPIUM_HOME: ${{ inputs.platform == 'ios' && '/Users/runner/.appium' || '/home/runner/.appium' }}
    steps:
      - name: Fetch immutable public tools without credentials
        shell: pwsh
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TOOLS_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Tools revision is not pinned.' }
          $source = "$env:RUNNER_TEMP/issue-tools-source"
          git init --quiet $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare trusted tools checkout.' }
          git -c credential.helper= -c http.extraheader= -C $source fetch --quiet --no-tags --depth=1 `
            https://github.com/kubaflo/maui.git $env:TOOLS_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch public trusted tools.' }
          git -C $source checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $source rev-parse HEAD).Trim() -cne $env:TOOLS_SHA) {
            throw 'Tools checkout differs from the workflow revision.'
          }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/IssueTools" | Out-Null
          Copy-Item "$source/.github/scripts/IssueReplicate*.ps1" "$env:RUNNER_TEMP/IssueTools"
      - name: Restore only validated job data
        shell: pwsh
        env:
          REPRO_INPUT: ${{ inputs.snapshot }}
          REPRO_SAMPLE: ${{ inputs.sample }}
          REPRO_CANDIDATE: ${{ inputs.candidate }}
          REPRO_PREVIOUS: ${{ inputs.previous }}
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Input `
            -Encoded $env:REPRO_INPUT -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Sample `
            -Encoded $env:REPRO_SAMPLE -Directory "$env:RUNNER_TEMP/SampleOutput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Candidate `
            -Encoded $env:REPRO_CANDIDATE -Directory "$env:RUNNER_TEMP/Proposal"
          if ($env:REPRO_PREVIOUS) {
            & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Verified `
              -Encoded $env:REPRO_PREVIOUS -Directory "$env:RUNNER_TEMP/FirstAttempt"
          }
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Checkout.ps1" `
            -ManifestPath "$env:RUNNER_TEMP/IssueInput/manifest.json" -Destination "$env:RUNNER_TEMP/maui"
      - name: Require Xcode matching the pinned iOS SDK
        if: inputs.platform == 'ios'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.SelectXcode.ps1" `
            -RepoRoot "$env:RUNNER_TEMP/maui" -Provider GitHub
      - name: Bootstrap the exact source-pinned SDK before restoring tools
        shell: bash
        run: |
          set -euo pipefail
          export use_installed_dotnet_cli=false
          source "$RUNNER_TEMP/maui/eng/common/tools.sh"
          ReadGlobalVersion dotnet
          if [[ "$_ReadGlobalVersion" == *-* ]]; then
            export runtime_source_feed=https://ci.dot.net/public
          fi
          InitializeDotNetCli true
          printf '%s\n' "$_InitializeDotNetCli" >> "$GITHUB_PATH"
      - name: Provision pinned native SDK and workloads
        shell: pwsh
        working-directory: ${{ runner.temp }}/maui
        run: |
          & ./build.ps1 --target=dotnet --configuration=Release --verbosity=minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK/workload provisioning failed.' }
          "$env:RUNNER_TEMP/maui/.dotnet" >> $env:GITHUB_PATH
      - name: Build pinned MAUI tasks
        shell: pwsh
        working-directory: ${{ runner.temp }}/maui
        run: |
          dotnet build Microsoft.Maui.BuildTasks.slnf -c Debug -p:BuildTaskOnlyBuild=true --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MAUI build tasks failed.' }
      - name: Record iOS toolchain
        if: inputs.platform == 'ios'
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcrun --kill-cache
          xcodebuild -version
          xcrun --find actool
          xcrun --sdk macosx --find actool
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Provision UI dependencies
        shell: bash
        env:
          ISSUE_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .kind "$RUNNER_TEMP/Proposal/candidate.json")" != ui ]; then exit 0; fi
          dotnet build "$RUNNER_TEMP/maui/src/Provisioning/Provisioning.csproj" -t:ProvisionAppium -p:SkipAppiumDoctor=true
          if [ "$ISSUE_PLATFORM" != android ]; then exit 0; fi
          sudo chmod a+rw /dev/kvm
          test -d "$ANDROID_SDK_ROOT"
          for tool_dir in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$tool_dir/sdkmanager" ]; then break; fi
          done
          test -x "$tool_dir/sdkmanager"
          "$tool_dir/sdkmanager" --install "system-images;android-30;google_apis;x86_64" "platforms;android-30"
          echo no | "$tool_dir/avdmanager" create avd --force --name IssueRepro --package "system-images;android-30;google_apis;x86_64"
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd IssueRepro -no-window -no-audio -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/issue-emulator.log" 2>&1 &
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 600 "$adb" wait-for-device
          for _attempt in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
              echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 5
          done
          echo 'Android emulator failed to boot' >&2
          exit 1
      - name: Run the real verifier without credentials
        id: transfer
        shell: pwsh
        env:
          ISSUE_ATTEMPT: ${{ inputs.attempt }}
        run: |
          $previous = if ($env:ISSUE_ATTEMPT -eq '2') { "$env:RUNNER_TEMP/FirstAttempt/result.json" } else { '' }
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Run.ps1" -Mode Verify `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" `
            -SampleResultPath "$env:RUNNER_TEMP/SampleOutput/sample-result.json" `
            -CandidatePath "$env:RUNNER_TEMP/Proposal/candidate.json" `
            -RepoRoot "$env:RUNNER_TEMP/maui" -OutputDirectory "$env:RUNNER_TEMP/Verified" `
            -Attempt ([int]$env:ISSUE_ATTEMPT) -PreviousResultPath $previous -Provider GitHub
