name: Credential-free canary verification

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      snapshot:
        type: string
        required: true
      sample:
        type: string
        required: true
      candidate:
        type: string
        required: true
    outputs:
      result:
        value: ${{ jobs.verify.outputs.result }}
      verdict:
        value: ${{ jobs.verify.outputs.verdict }}

permissions: {}

jobs:
  first:
    uses: ./.github/workflows/issue-replicate-canary-attempt.yml
    with:
      platform: ${{ inputs.platform }}
      snapshot: ${{ inputs.snapshot }}
      sample: ${{ inputs.sample }}
      candidate: ${{ inputs.candidate }}
      attempt: 1
  verify:
    needs: first
    uses: ./.github/workflows/issue-replicate-canary-attempt.yml
    with:
      platform: ${{ inputs.platform }}
      snapshot: ${{ inputs.snapshot }}
      sample: ${{ inputs.sample }}
      candidate: ${{ inputs.candidate }}
      attempt: 2
      previous: ${{ needs.first.outputs.result }}
