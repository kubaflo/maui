name: Fork Issue Replicate Canary

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public dotnet/maui issue
        default: '37323'
        required: true
      source_comment_id:
        description: Existing comment on that issue (read-only canary)
        default: '5262801924'
        required: true
      platform:
        description: Native platform for the canary (iOS uses a simulator)
        type: choice
        options:
          - android
          - ios
        default: android
        required: true
      feedback_run_id:
        description: Prior canary run supplying inconclusive test feedback
        required: false

permissions:
  contents: read

jobs:
  intake:
    if: github.repository == 'kubaflo/maui' && github.actor == 'kubaflo'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run real bounded intake
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ inputs.source_comment_id }}
          ISSUE_PLATFORM: ${{ inputs.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/IssueReplicate.Intake.ps1 `
            -IssueNumber ([int]$env:ISSUE_NUMBER) -CommentId ([long]$env:COMMENT_ID) `
            -Platform $env:ISSUE_PLATFORM -TargetRef main -OutputDirectory "$env:RUNNER_TEMP/IssueInput"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/IssueTools" | Out-Null
          Copy-Item .github/scripts/IssueReplicate*.ps1 "$env:RUNNER_TEMP/IssueTools"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: IssueInput
          path: ${{ runner.temp }}/IssueInput
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: IssueTools
          path: ${{ runner.temp }}/IssueTools

  sample:
    needs: intake
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-22.04' }}
    timeout-minutes: 80
    env:
      DEVELOPER_DIR: ${{ inputs.platform == 'ios' && '/Applications/Xcode_26.0.1.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: IssueInput
          path: ${{ runner.temp }}/IssueInput
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: IssueTools
          path: ${{ runner.temp }}/IssueTools
      - name: Fetch pinned public source
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Checkout.ps1" `
            -ManifestPath "$env:RUNNER_TEMP/IssueInput/manifest.json" `
            -Destination "$env:RUNNER_TEMP/maui"
      - name: Provision pinned public SDK and workloads
        shell: pwsh
        working-directory: ${{ runner.temp }}/maui
        run: |
          & ./build.ps1 --target=dotnet --configuration=Release --verbosity=minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK/workload provisioning failed.' }
          "$env:RUNNER_TEMP/maui/.dotnet" >> $env:GITHUB_PATH
      - name: Install public MAUI workload for the author sample
        shell: pwsh
        env:
          ISSUE_PLATFORM: ${{ inputs.platform }}
        run: |
          $sdkVersion = (Get-Content -Raw "$env:RUNNER_TEMP/maui/global.json" | ConvertFrom-Json).tools.dotnet
          if ($sdkVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') {
            throw 'Could not identify the pinned public SDK distribution version.'
          }
          $sampleSdk = "$env:RUNNER_TEMP/author-dotnet"
          bash "$env:RUNNER_TEMP/maui/temp/dotnet-install.sh" `
            --version $sdkVersion --install-dir $sampleSdk --no-path `
            --azure-feed https://ci.dot.net/public
          if ($LASTEXITCODE -ne 0) { throw 'Clean public sample SDK installation failed.' }
          & "$sampleSdk/dotnet" workload install "maui-$env:ISSUE_PLATFORM" --skip-manifest-update `
            --configfile "$env:RUNNER_TEMP/maui/NuGet.config" --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Public MAUI sample workload installation failed.' }
          $sampleSdk >> $env:GITHUB_PATH
      - name: Record iOS toolchain
        if: inputs.platform == 'ios'
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcrun --kill-cache
          xcodebuild -version
          xcrun --find actool
          xcrun --sdk macosx --find actool
          xcrun simctl list runtimes
      - name: Build the actual author sample
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Sample.ps1" `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" `
            -OutputDirectory "$env:RUNNER_TEMP/SampleOutput" `
            -NuGetConfigPath "$env:RUNNER_TEMP/maui/NuGet.config"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: SampleOutput
          path: ${{ runner.temp }}/SampleOutput

  generate:
    needs: intake
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: IssueInput
          path: ${{ runner.temp }}/IssueInput
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: IssueTools
          path: ${{ runner.temp }}/IssueTools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.feedback_run_id != ''
        with:
          name: Verified1
          path: ${{ runner.temp }}/PreviousVerification
          run-id: ${{ inputs.feedback_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install Copilot CLI
        run: npm install --global @github/copilot && copilot --version
      - name: Generate real tool-free GPT candidate
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          FEEDBACK_RUN: ${{ inputs.feedback_run_id }}
        run: |
          $feedbackArguments = @{}
          if ($env:FEEDBACK_RUN) {
            . "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Core.ps1"
            $content = Get-IssueReplicateFeedback -Path "$env:RUNNER_TEMP/PreviousVerification/Verified1/test.log"
            $feedback = "$env:RUNNER_TEMP/test-feedback.txt"
            Set-Content -LiteralPath $feedback -Value $content -Encoding utf8
            $feedbackArguments.FeedbackPath = $feedback
          }
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Generate.ps1" `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" `
            -OutputDirectory "$env:RUNNER_TEMP/Proposal1" @feedbackArguments
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Proposal1
          path: ${{ runner.temp }}/Proposal1

  verify:
    needs: [sample, generate]
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-22.04' }}
    timeout-minutes: 120
    env:
      APPIUM_HOME: ${{ inputs.platform == 'ios' && '/Users/runner/.appium' || '/home/runner/.appium' }}
      DEVELOPER_DIR: ${{ inputs.platform == 'ios' && '/Applications/Xcode_26.0.1.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '*'
          path: ${{ runner.temp }}/artifacts
      - name: Fetch pinned public source
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/artifacts/IssueTools/IssueReplicate.Checkout.ps1" `
            -ManifestPath "$env:RUNNER_TEMP/artifacts/IssueInput/manifest.json" `
            -Destination "$env:RUNNER_TEMP/maui"
      - name: Provision pinned public SDK and workloads
        shell: pwsh
        working-directory: ${{ runner.temp }}/maui
        run: |
          & ./build.ps1 --target=dotnet --configuration=Release --verbosity=minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK/workload provisioning failed.' }
          "$env:RUNNER_TEMP/maui/.dotnet" >> $env:GITHUB_PATH
      - name: Build pinned MAUI tasks
        shell: pwsh
        working-directory: ${{ runner.temp }}/maui
        run: |
          dotnet build Microsoft.Maui.BuildTasks.slnf -c Debug -p:BuildTaskOnlyBuild=true --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MAUI build tasks failed.' }
      - name: Record iOS toolchain
        if: inputs.platform == 'ios'
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcrun --kill-cache
          xcodebuild -version
          xcrun --find actool
          xcrun --sdk macosx --find actool
          xcrun simctl list runtimes
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Provision UI candidate dependencies
        shell: bash
        env:
          ISSUE_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .kind "$RUNNER_TEMP/artifacts/Proposal1/candidate.json")" != ui ]; then
            exit 0
          fi
          dotnet build "$RUNNER_TEMP/maui/src/Provisioning/Provisioning.csproj" -t:ProvisionAppium -p:SkipAppiumDoctor=true
          if [ "$ISSUE_PLATFORM" != android ]; then
            exit 0
          fi
          sudo chmod a+rw /dev/kvm
          test -d "$ANDROID_SDK_ROOT"
          for tool_dir in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$tool_dir/sdkmanager" ]; then
              break
            fi
          done
          test -x "$tool_dir/sdkmanager"
          "$tool_dir/sdkmanager" --install "system-images;android-30;google_apis;x86_64" "platforms;android-30"
          echo no | "$tool_dir/avdmanager" create avd --force --name IssueRepro --package "system-images;android-30;google_apis;x86_64"
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd IssueRepro -no-window -no-audio -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/issue-emulator.log" 2>&1 &
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 600 "$adb" wait-for-device
          for _attempt in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
              echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 5
          done
          echo 'Android emulator failed to boot' >&2
          exit 1
      - name: Run real credential-free candidate verifier
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/artifacts/IssueTools/IssueReplicate.Verify.ps1" `
            -ManifestPath "$env:RUNNER_TEMP/artifacts/IssueInput/manifest.json" `
            -SampleResultPath "$env:RUNNER_TEMP/artifacts/SampleOutput/sample-result.json" `
            -CandidatePath "$env:RUNNER_TEMP/artifacts/Proposal1/candidate.json" `
            -RepoRoot "$env:RUNNER_TEMP/maui" -OutputDirectory "$env:RUNNER_TEMP/Verified1"
          Get-Content "$env:RUNNER_TEMP/Verified1/result.json" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Verified1
          path: |
            ${{ runner.temp }}/Verified1
            ${{ runner.temp }}/issue-emulator.log
            ${{ runner.temp }}/maui/CustomAgentLogsTmp/UITests
