name: Fork Issue Replicate Canary
run-name: "Six-issue recovery: #${{ inputs.issue_number }} (${{ inputs.platform }}, ${{ inputs.target_ref }})"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public dotnet/maui issue
        default: '38909'
        required: true
      source_comment_id:
        description: Existing comment on that issue
        default: '5868610701'
        required: true
      platform:
        description: Native platform (iOS uses a simulator)
        type: choice
        options: [android, ios]
        default: ios
        required: true
      target_ref:
        description: Explicit framework target; do not retarget the author sample
        type: choice
        options: [main, net11.0]
        default: main
        required: true
      source_url:
        description: Exact supported link in latest author repro text; empty keeps ambiguity rejection
        default: ''
        required: false
      android_api:
        description: Hosted emulator API, recorded separately from framework target
        type: choice
        options: ['30', '35', '36']
        default: '35'
        required: true
      candidate_profile:
        description: Generated draft or unchanged reviewed WebView controls
        type: choice
        options: [generated, android-webview-scroll]
        default: generated
        required: true
      record_video:
        description: Bounded named-body native recording
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  intake:
    if: github.repository == 'kubaflo/maui' && github.actor == 'kubaflo'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      snapshot: ${{ steps.snapshot.outputs.payload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin bounded public intake
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ inputs.source_comment_id }}
          ISSUE_PLATFORM: ${{ inputs.platform }}
          TARGET_REF: ${{ inputs.target_ref }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/IssueReplicate.Intake.ps1 `
            -IssueNumber ([int]$env:ISSUE_NUMBER) -CommentId ([long]$env:COMMENT_ID) `
            -Platform $env:ISSUE_PLATFORM -TargetRef $env:TARGET_REF -SourceUrl $env:SOURCE_URL `
            -OutputDirectory "$env:RUNNER_TEMP/IssueInput"
      - name: Transfer snapshot through job outputs
        id: snapshot
        shell: pwsh
        run: |
          & .github/scripts/IssueReplicate.Transport.ps1 -Mode Export -Kind Input `
            -Directory "$env:RUNNER_TEMP/IssueInput" -Provider GitHub

  sample:
    needs: intake
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-22.04' }}
    timeout-minutes: 80
    permissions: {}
    outputs:
      result: ${{ steps.sample.outputs.payload }}
    steps:
      - &tools
        name: Fetch immutable public tools without credentials
        shell: pwsh
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TOOLS_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Tools revision is not pinned.' }
          $source = "$env:RUNNER_TEMP/issue-tools-source"
          git init --quiet $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare trusted tools checkout.' }
          git -c credential.helper= -c http.extraheader= -C $source fetch --quiet --no-tags --depth=1 `
            https://github.com/kubaflo/maui.git $env:TOOLS_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch trusted public tools.' }
          git -C $source checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $source rev-parse HEAD).Trim() -cne $env:TOOLS_SHA) {
            throw 'Tools checkout differs from the workflow revision.'
          }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/IssueTools" | Out-Null
          Copy-Item "$source/.github/scripts/IssueReplicate*.ps1" "$env:RUNNER_TEMP/IssueTools"
          Copy-Item "$source/.github/issue-replicate-cli" "$env:RUNNER_TEMP/IssueTools/Cli" -Recurse
      - name: Restore and re-fetch the immutable author sample
        shell: pwsh
        env:
          REPRO_INPUT: ${{ needs.intake.outputs.snapshot }}
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Input `
            -Encoded $env:REPRO_INPUT -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode FetchSample `
            -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Checkout.ps1" `
            -ManifestPath "$env:RUNNER_TEMP/IssueInput/manifest.json" -Destination "$env:RUNNER_TEMP/maui"
      - name: Bootstrap the exact source-pinned SDK before restoring tools
        shell: bash
        run: |
          set -euo pipefail
          export use_installed_dotnet_cli=false
          source "$RUNNER_TEMP/maui/eng/common/tools.sh"
          ReadGlobalVersion dotnet
          if [[ "$_ReadGlobalVersion" == *-* ]]; then
            export runtime_source_feed=https://ci.dot.net/public
          fi
          bootstrap="$RUNNER_TEMP/issue-bootstrap-dotnet"
          InstallDotNetSdk "$bootstrap" "$_ReadGlobalVersion"
          printf '%s\n' "$bootstrap" >> "$GITHUB_PATH"
          printf '%s\n' 'DOTNET_MULTILEVEL_LOOKUP=0' 'DOTNET_NOLOGO=1' >> "$GITHUB_ENV"
      - name: Provision pinned native SDK and workloads
        shell: pwsh
        working-directory: ${{ runner.temp }}/maui
        run: |
          & ./build.ps1 --target=dotnet --configuration=Release --verbosity=minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK/workload provisioning failed.' }
          "$env:RUNNER_TEMP/maui/.dotnet" >> $env:GITHUB_PATH
      - name: Install public author-sample workload
        shell: pwsh
        env:
          ISSUE_PLATFORM: ${{ inputs.platform }}
        run: |
          $sdk = "$env:RUNNER_TEMP/author-dotnet"
          & pwsh -NoProfile -File "$env:RUNNER_TEMP/IssueTools/IssueReplicate.ProvisionSample.ps1" `
            -RepoRoot "$env:RUNNER_TEMP/maui" -InstallDirectory $sdk -Platform $env:ISSUE_PLATFORM `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput"
          if ($LASTEXITCODE -ne 0) { throw 'Public author-sample workload installation failed.' }
          $sdk >> $env:GITHUB_PATH
      - name: Record iOS toolchain
        if: inputs.platform == 'ios'
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcrun --kill-cache
          xcodebuild -version
          xcrun --find actool
          xcrun --sdk macosx --find actool
      - name: Build the author sample without credentials
        id: sample
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Run.ps1" -Mode Sample `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" -OutputDirectory "$env:RUNNER_TEMP/SampleOutput" `
            -NuGetConfigPath "$env:RUNNER_TEMP/maui/NuGet.config" -Provider GitHub

  generate:
    needs: [intake, sample]
    if: ${{ !cancelled() && needs.intake.result == 'success' && needs.sample.outputs.result != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.payload }}
    steps:
      - *tools
      - name: Restore bounded generation input
        shell: pwsh
        env:
          REPRO_INPUT: ${{ needs.intake.outputs.snapshot }}
          REPRO_SAMPLE: ${{ needs.sample.outputs.result }}
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Input `
            -Encoded $env:REPRO_INPUT -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode FetchSample `
            -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Sample `
            -Encoded $env:REPRO_SAMPLE -Directory "$env:RUNNER_TEMP/SampleOutput"
      - &node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: inputs.candidate_profile == 'generated'
        with:
          node-version: '24'
      - &copilot
        name: Install lockfile-pinned Copilot CLI
        if: inputs.candidate_profile == 'generated'
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/IssueTools/Cli"
          npm ci --prefix "$cli" --ignore-scripts --no-audit --no-fund
          "$cli/node_modules/.bin/copilot" --version
          printf '%s\n' "$cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Generate a tool-free GPT candidate
        if: inputs.candidate_profile == 'generated'
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Generate.ps1" `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" -OutputDirectory "$env:RUNNER_TEMP/Proposal" `
            -SampleResultPath "$env:RUNNER_TEMP/SampleOutput/sample-result.json"
      - name: Replay the unchanged reviewed WebView controls
        if: inputs.candidate_profile == 'android-webview-scroll'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Core.ps1"
          $manifest = Get-Content -Raw "$env:RUNNER_TEMP/IssueInput/manifest.json" | ConvertFrom-Json
          if ($manifest.issueNumber -ne 38452 -or $manifest.platform -cne 'android' -or
              $manifest.sourceUrl -cne 'https://github.com/kklose23/android-webview-scroll' -or
              $manifest.sourceCommit -cne '28af4be272d1537091efa3f63301665fe4b895c9') {
            throw 'The reviewed profile does not match the unchanged author source.'
          }
          $profile = "$env:RUNNER_TEMP/issue-tools-source/.github/issue-replicate-canary/android-webview-scroll"
          $candidate = @{
            kind = 'ui'
            files = @(
              @{ path = 'src/Controls/tests/TestCases.HostApp/Issues/Issue38452.cs'; content = [IO.File]::ReadAllText("$profile/HostApp.cs") },
              @{ path = 'src/Controls/tests/TestCases.Shared.Tests/Tests/Issues/Issue38452.cs'; content = [IO.File]::ReadAllText("$profile/Tests.cs") }
            )
          }
          Assert-IssueReplicateCandidate -Candidate ([pscustomobject]$candidate) -IssueNumber 38452 -Platform android | Out-Null
          New-Item -ItemType Directory "$env:RUNNER_TEMP/Proposal" | Out-Null
          $candidate | ConvertTo-Json -Depth 6 -Compress |
            Set-Content -LiteralPath "$env:RUNNER_TEMP/Proposal/candidate.json" -Encoding utf8
      - name: Transfer bounded candidate
        id: candidate
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Export -Kind Candidate `
            -Directory "$env:RUNNER_TEMP/Proposal" -Provider GitHub

  verify:
    needs: [intake, sample, generate]
    if: ${{ !cancelled() && needs.sample.result == 'success' && needs.generate.result == 'success' }}
    permissions: {}
    uses: ./.github/workflows/issue-replicate-canary-verify.yml
    with:
      platform: ${{ inputs.platform }}
      snapshot: ${{ needs.intake.outputs.snapshot }}
      sample: ${{ needs.sample.outputs.result }}
      candidate: ${{ needs.generate.outputs.candidate }}
      android_api: ${{ inputs.android_api }}
      record_video: ${{ inputs.record_video }}

  revise:
    needs: [intake, sample, verify]
    if: needs.verify.result == 'success' && needs.verify.outputs.verdict == 'inconclusive' && inputs.candidate_profile == 'generated'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.payload }}
    steps:
      - *tools
      - name: Restore bounded input and first-run feedback
        shell: pwsh
        env:
          REPRO_INPUT: ${{ needs.intake.outputs.snapshot }}
          REPRO_SAMPLE: ${{ needs.sample.outputs.result }}
          REPRO_FEEDBACK: ${{ needs.verify.outputs.result }}
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Input `
            -Encoded $env:REPRO_INPUT -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode FetchSample `
            -Directory "$env:RUNNER_TEMP/IssueInput"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Verified `
            -Encoded $env:REPRO_FEEDBACK -Directory "$env:RUNNER_TEMP/Verified"
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Sample `
            -Encoded $env:REPRO_SAMPLE -Directory "$env:RUNNER_TEMP/SampleOutput"
      - *node
      - *copilot
      - name: Revise once from actual bounded feedback
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Generate.ps1" `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" -OutputDirectory "$env:RUNNER_TEMP/Proposal" `
            -SampleResultPath "$env:RUNNER_TEMP/SampleOutput/sample-result.json" `
            -FeedbackPath "$env:RUNNER_TEMP/Verified/feedback.txt"
      - name: Transfer the revised candidate
        id: candidate
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/IssueTools/IssueReplicate.Transport.ps1" -Mode Export -Kind Candidate `
            -Directory "$env:RUNNER_TEMP/Proposal" -Provider GitHub

  verify-revised:
    needs: [intake, sample, revise]
    if: always() && needs.revise.result == 'success'
    permissions: {}
    uses: ./.github/workflows/issue-replicate-canary-verify.yml
    with:
      platform: ${{ inputs.platform }}
      snapshot: ${{ needs.intake.outputs.snapshot }}
      sample: ${{ needs.sample.outputs.result }}
      candidate: ${{ needs.revise.outputs.candidate }}
      android_api: ${{ inputs.android_api }}
      record_video: ${{ inputs.record_video }}

  post:
    needs: [intake, sample, generate, verify, revise, verify-revised]
    if: always() && github.repository == 'kubaflo/maui' && github.actor == 'kubaflo'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Prepare a validated comment on a fresh agent
        shell: pwsh
        env:
          REPRO_INPUT: ${{ needs.intake.outputs.snapshot }}
          REPRO_VERIFIED1: ${{ needs.verify.outputs.result }}
          REPRO_VERIFIED2: ${{ needs.verify-revised.outputs.result }}
          REPRO_SAMPLE: ${{ needs.sample.outputs.result }}
          REPRO_CANDIDATE1: ${{ needs.generate.outputs.candidate }}
          REPRO_CANDIDATE2: ${{ needs.revise.outputs.candidate }}
          REPRO_FIRST_VIDEO_0: ${{ needs.verify.outputs.recording0 }}
          REPRO_FIRST_VIDEO_1: ${{ needs.verify.outputs.recording1 }}
          REPRO_FIRST_VIDEO_2: ${{ needs.verify.outputs.recording2 }}
          REPRO_FIRST_VIDEO_3: ${{ needs.verify.outputs.recording3 }}
          REPRO_SECOND_VIDEO_0: ${{ needs.verify-revised.outputs.recording0 }}
          REPRO_SECOND_VIDEO_1: ${{ needs.verify-revised.outputs.recording1 }}
          REPRO_SECOND_VIDEO_2: ${{ needs.verify-revised.outputs.recording2 }}
          REPRO_SECOND_VIDEO_3: ${{ needs.verify-revised.outputs.recording3 }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ inputs.source_comment_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDirectory = "$env:RUNNER_TEMP/IssueInput"
          $resultsDirectory = "$env:RUNNER_TEMP/Verified"
          if ($env:REPRO_INPUT) {
            & .github/scripts/IssueReplicate.Transport.ps1 -Mode Import -Kind Input `
              -Encoded $env:REPRO_INPUT -Directory $inputDirectory
            Write-Host "REPRO_INPUT=$env:REPRO_INPUT"
          }
          if ($env:REPRO_SAMPLE) {
            & .github/scripts/IssueReplicate.Transport.ps1 -Mode Import -Kind Sample `
              -Encoded $env:REPRO_SAMPLE -Directory "$env:RUNNER_TEMP/SampleOutput"
            Write-Host "REPRO_SAMPLE=$env:REPRO_SAMPLE"
          }
          $verified = if ($env:REPRO_VERIFIED2) { $env:REPRO_VERIFIED2 } elseif (-not $env:REPRO_CANDIDATE2) { $env:REPRO_VERIFIED1 }
          if ($verified) {
            & .github/scripts/IssueReplicate.Transport.ps1 -Mode Import -Kind Verified `
              -Encoded $verified -Directory $resultsDirectory
            Write-Host "REPRO_VERIFIED=$verified"
          }
          $candidate = if ($env:REPRO_CANDIDATE2) { $env:REPRO_CANDIDATE2 } else { $env:REPRO_CANDIDATE1 }
          $videoPrefix = if ($env:REPRO_CANDIDATE2) { 'REPRO_SECOND_VIDEO_' } else { 'REPRO_FIRST_VIDEO_' }
          foreach ($index in 0..3) {
            $chunk = [Environment]::GetEnvironmentVariable("$videoPrefix$index")
            if ($chunk -and ($chunk.Length -gt 88000 -or $chunk -cnotmatch '^[A-Za-z0-9+/]+={0,2}$')) {
              throw 'A recording chunk exceeds the existing bounded transport contract.'
            }
            [Environment]::SetEnvironmentVariable("REPRO_VIDEO_$index", $chunk)
            [IO.File]::AppendAllText($env:GITHUB_ENV, "REPRO_VIDEO_$index=$chunk`n")
            if ($chunk) { Write-Host "REPRO_VIDEO_$index=$chunk" }
          }
          $candidateDirectory = ''
          if ($candidate) {
            $candidateDirectory = "$env:RUNNER_TEMP/DraftCandidate"
            & .github/scripts/IssueReplicate.Transport.ps1 -Mode Import -Kind Candidate `
              -Encoded $candidate -Directory $candidateDirectory
            Write-Host "REPRO_CANDIDATE=$candidate"
          }
          & .github/scripts/IssueReplicate.Post.ps1 -IssueNumber ([int]$env:ISSUE_NUMBER) `
            -CommentId ([long]$env:COMMENT_ID) -GitHubRunId ([long]$env:GITHUB_RUN_ID) `
            -GitHubRepository $env:GITHUB_REPOSITORY `
            -InputDirectory $inputDirectory -ResultsDirectory $resultsDirectory `
            -SampleDirectory "$env:RUNNER_TEMP/SampleOutput" -CandidateDirectory $candidateDirectory `
            -OutputPath "$env:RUNNER_TEMP/comment-preview.md"
      - name: Publish only issue comments
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ISSUE_REPRO_COMMENT_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ inputs.source_comment_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'The dedicated issue-comment publishing credential is not configured.' }
          $candidateDirectory = if (Test-Path "$env:RUNNER_TEMP/DraftCandidate/candidate.json") {
            "$env:RUNNER_TEMP/DraftCandidate"
          } else { '' }
          & .github/scripts/IssueReplicate.Post.ps1 -IssueNumber ([int]$env:ISSUE_NUMBER) `
            -CommentId ([long]$env:COMMENT_ID) -GitHubRunId ([long]$env:GITHUB_RUN_ID) `
            -GitHubRepository $env:GITHUB_REPOSITORY `
            -InputDirectory "$env:RUNNER_TEMP/IssueInput" -ResultsDirectory "$env:RUNNER_TEMP/Verified" `
            -SampleDirectory "$env:RUNNER_TEMP/SampleOutput" -CandidateDirectory $candidateDirectory
